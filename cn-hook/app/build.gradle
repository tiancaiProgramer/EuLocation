plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ux5.hyperos3.perappcn'
    compileSdk 35

    defaultConfig {
        applicationId "com.ux5.hyperos3.perappcn"
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName "0.7"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
}
